name: Release

# Push a tag like v1.0.0 to build executables for every platform and publish a GitHub release
# whose notes come from that version's section in CHANGELOG.md.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match __version__ and have a changelog entry
        run: python scripts/release_notes.py --check "${GITHUB_REF_NAME}"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            asset: ProfitCalculator-Windows.exe
          - os: macos-latest
            name: macOS
            asset: ProfitCalculator-macOS.zip
          - os: ubuntu-latest
            name: Linux
            asset: ProfitCalculator-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name ProfitCalculator profit_calculator.py
          Move-Item dist/ProfitCalculator.exe "${{ matrix.asset }}"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name ProfitCalculator profit_calculator.py
          ditto -c -k --sequesterRsrc --keepParent dist/ProfitCalculator.app "${{ matrix.asset }}"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name ProfitCalculator profit_calculator.py
          mv dist/ProfitCalculator "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        run: python scripts/release_notes.py "${GITHUB_REF_NAME}" > release_notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --title "Profit Calculator ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md
