name: Build & Release

# Builds standalone apps (Python and Tk are bundled inside - nothing for the end user to install)
# for Windows, macOS (Apple Silicon + Intel) and Linux (x64 + arm64).
#
# All in the browser: repo -> Actions tab -> "Build & Release" -> Run workflow (branch: main).
#   * "Publish a GitHub release" UNticked -> build + self-test only; apps appear under the run's
#                                           Artifacts. Nothing is tagged or published.
#   * "Publish a GitHub release" ticked   -> also creates tag v<__version__> on main and publishes
#                                           the release, using that version's CHANGELOG.md section
#                                           as the release notes.
# Pushing a tag like v1.0.0 from the command line works too.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (creates tag v<version> automatically)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether to publish, and which tag
        id: plan
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          VERSION=$(python -c 'import re; print(re.search(r"^__version__\s*=\s*\"([^\"]+)\"", open("profit_calculator.py", encoding="utf-8").read(), re.M).group(1))')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"; PUBLISH=true
          elif [ "$RELEASE_INPUT" = "true" ]; then
            TAG="v$VERSION"; PUBLISH=true
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Publish a release from the main branch (this run used $GITHUB_REF)."; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists. Bump __version__ in profit_calculator.py and add a CHANGELOG.md entry first."; exit 1
            fi
          else
            TAG=""; PUBLISH=false
          fi
          if [ "$PUBLISH" = "true" ]; then
            python scripts/release_notes.py --check "$TAG"
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION | publish=$PUBLISH | tag=$TAG"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64,         os: windows-latest,   asset: ProfitCalculator-Windows-x64.exe }
          - { name: macOS Apple Silicon, os: macos-latest,     asset: ProfitCalculator-macOS-AppleSilicon.zip }
          - { name: macOS Intel,         os: macos-15-intel,   asset: ProfitCalculator-macOS-Intel.zip }
          # Linux is built on the oldest runner so it also runs on older distributions.
          - { name: Linux x64,           os: ubuntu-22.04,     asset: ProfitCalculator-Linux-x64.tar.gz }
          - { name: Linux arm64,         os: ubuntu-22.04-arm, asset: ProfitCalculator-Linux-arm64.tar.gz }
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- Windows
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.10,<7"
          pyinstaller --onefile --windowed --icon assets/icon.ico --hidden-import icons_data --name ProfitCalculator profit_calculator.py
          Move-Item dist/ProfitCalculator.exe "${{ matrix.asset }}"
      - name: Self-test the built app (Windows)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\${{ matrix.asset }}" -ArgumentList "--selftest","selftest-result.txt" -Wait -PassThru
          Get-Content selftest-result.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      # ------------------------------------------------------------------ macOS
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install "pyinstaller>=6.10,<7"
          pyinstaller --windowed --icon assets/icon.icns --hidden-import icons_data --name ProfitCalculator profit_calculator.py
          codesign --force --deep --sign - dist/ProfitCalculator.app
          codesign --verify --deep --strict dist/ProfitCalculator.app
          ditto -c -k --sequesterRsrc --keepParent dist/ProfitCalculator.app "${{ matrix.asset }}"
      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf selftest && mkdir selftest && ditto -x -k "${{ matrix.asset }}" selftest
          selftest/ProfitCalculator.app/Contents/MacOS/ProfitCalculator --selftest "$PWD/selftest-result.txt" || { cat selftest-result.txt; exit 1; }
          cat selftest-result.txt

      # ------------------------------------------------------------------ Linux
      # Uses the distribution's own Python + Tk; PyInstaller copies both into the app.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv binutils xvfb
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          pip install "pyinstaller>=6.10,<7"
          pyinstaller --onefile --hidden-import icons_data --name ProfitCalculator profit_calculator.py
          tar -czf "${{ matrix.asset }}" -C dist ProfitCalculator
      - name: Self-test the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf selftest && mkdir selftest && tar -xzf "${{ matrix.asset }}" -C selftest
          xvfb-run -a selftest/ProfitCalculator --selftest "$PWD/selftest-result.txt" || { cat selftest-result.txt; exit 1; }
          cat selftest-result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$TAG" > release_notes.md
      - name: Checksums
        run: cd release-files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release (creates the tag if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release-files/* \
            --target "$GITHUB_SHA" \
            --title "Profit Calculator $TAG" \
            --notes-file release_notes.md
