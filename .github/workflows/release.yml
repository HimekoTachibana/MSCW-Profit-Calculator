name: Build & Release

# Builds standalone apps (Python and Tk are bundled inside - nothing for the end user to install)
# for Windows, macOS (Apple Silicon + Intel) and Linux (x64 + arm64).
#
# All in the browser: repo -> Actions tab -> "Build & Release" -> Run workflow (branch: main).
#   * "Publish a GitHub release" UNticked -> build + self-test only; apps appear under the run's
#                                           Artifacts. Nothing is tagged or published.
#   * "Publish a GitHub release" ticked   -> also creates tag v<__version__> on main and publishes
#                                           the release, using that version's CHANGELOG.md section
#                                           as the release notes.
# Pushing a tag like v1.0.0 from the command line works too.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (creates tag v<version> automatically)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Decide whether to publish, and which tag
        id: plan
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          VERSION=$(python -c 'import re; print(re.search(r"^__version__\s*=\s*\"([^\"]+)\"", open("mscw_merchant_simulator.py", encoding="utf-8").read(), re.M).group(1))')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"; PUBLISH=true
          elif [ "$RELEASE_INPUT" = "true" ]; then
            TAG="v$VERSION"; PUBLISH=true
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Publish a release from the main branch (this run used $GITHUB_REF)."; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists. Bump __version__ in mscw_merchant_simulator.py and add a CHANGELOG.md entry first."; exit 1
            fi
          else
            TAG=""; PUBLISH=false
          fi
          if [ "$PUBLISH" = "true" ]; then
            python scripts/release_notes.py --check "$TAG"
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION | publish=$PUBLISH | tag=$TAG"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64,         os: windows-latest,   base: Windows-x64, ext: .exe }
          - { name: macOS Apple Silicon, os: macos-latest,     base: macOS-AppleSilicon, ext: .zip }
          - { name: macOS Intel,         os: macos-15-intel,   base: macOS-Intel, ext: .zip }
          # Linux is built on the oldest runner so it also runs on older distributions.
          - { name: Linux x64,           os: ubuntu-22.04,     base: Linux-x64, ext: .tar.gz }
          - { name: Linux arm64,         os: ubuntu-22.04-arm, base: Linux-arm64, ext: .tar.gz }
    name: Build ${{ matrix.name }}
    needs: prepare
    env:
      # e.g. MSCW-Merchant-Simulator-v1.1.0-Windows-x64.exe - the version is always in the file name
      ASSET: MSCW-Merchant-Simulator-v${{ needs.prepare.outputs.version }}-${{ matrix.base }}${{ matrix.ext }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # ---------------------------------------------------------------- Windows
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.10,<7" certifi
          python tests/test_updater.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/embed_changelog.py
          pyinstaller --onefile --windowed --icon assets/icon.ico --hidden-import icons_data --hidden-import changelog_data --hidden-import updater --hidden-import certifi --name MSCW-Merchant-Simulator mscw_merchant_simulator.py
          Move-Item dist/MSCW-Merchant-Simulator.exe "${{ env.ASSET }}"
      - name: Self-test the built app (Windows)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\${{ env.ASSET }}" -ArgumentList "--selftest","selftest-result.txt" -Wait -PassThru
          Get-Content selftest-result.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      # ------------------------------------------------------------------ macOS
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install "pyinstaller>=6.10,<7" certifi
          python tests/test_updater.py
          python scripts/embed_changelog.py
          pyinstaller --windowed --icon assets/icon.icns --hidden-import icons_data --hidden-import changelog_data --hidden-import updater --hidden-import certifi --name MSCW-Merchant-Simulator mscw_merchant_simulator.py
          codesign --force --deep --sign - dist/MSCW-Merchant-Simulator.app
          codesign --verify --deep --strict dist/MSCW-Merchant-Simulator.app
          ditto -c -k --sequesterRsrc --keepParent dist/MSCW-Merchant-Simulator.app "${{ env.ASSET }}"
      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf selftest && mkdir selftest && ditto -x -k "${{ env.ASSET }}" selftest
          selftest/MSCW-Merchant-Simulator.app/Contents/MacOS/MSCW-Merchant-Simulator --selftest "$PWD/selftest-result.txt" || { cat selftest-result.txt; exit 1; }
          cat selftest-result.txt

      # ------------------------------------------------------------------ Linux
      # Uses the distribution's own Python + Tk; PyInstaller copies both into the app.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv binutils xvfb
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          pip install "pyinstaller>=6.10,<7" certifi
          python tests/test_updater.py
          python scripts/embed_changelog.py
          pyinstaller --onefile --hidden-import icons_data --hidden-import changelog_data --hidden-import updater --hidden-import certifi --name MSCW-Merchant-Simulator mscw_merchant_simulator.py
          tar -czf "${{ env.ASSET }}" -C dist MSCW-Merchant-Simulator
      - name: Self-test the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf selftest && mkdir selftest && tar -xzf "${{ env.ASSET }}" -C selftest
          xvfb-run -a selftest/MSCW-Merchant-Simulator --selftest "$PWD/selftest-result.txt" || { cat selftest-result.txt; exit 1; }
          cat selftest-result.txt

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$TAG" > release_notes.md
      - name: Checksums
        run: cd release-files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release (creates the tag if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release-files/* \
            --target "$GITHUB_SHA" \
            --title "MSCW Merchant Simulator $TAG" \
            --notes-file release_notes.md
